<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Verse Lookup display</title>
<style>
  :root {
    --bg: #faf8f4; --surface: #ffffff; --text: #231f1a; --muted: #6f675d;
    --accent: #7a4b1e; --border: #e3ddd2; --error: #b3261e;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #1b1814; --surface: #25211c; --text: #efe9df; --muted: #a39a8c;
      --accent: #d9a566; --border: #3a342c; --error: #ff8a80;
      color-scheme: dark;
    }
  }
  /* themes chosen in the cog panel (Auto = follow the system, the rules above) */
  :root[data-theme="light"] {
    --bg: #faf8f4; --surface: #ffffff; --text: #231f1a; --muted: #6f675d;
    --accent: #7a4b1e; --border: #e3ddd2; --error: #b3261e; color-scheme: light;
  }
  :root[data-theme="dark"] {
    --bg: #1b1814; --surface: #25211c; --text: #efe9df; --muted: #a39a8c;
    --accent: #d9a566; --border: #3a342c; --error: #ff8a80; color-scheme: dark;
  }
  :root[data-theme="bw"] {   /* black text on white */
    --bg: #ffffff; --surface: #ffffff; --text: #000000; --muted: #333333;
    --accent: #000000; --border: #777777; --error: #c00000; color-scheme: light;
  }
  :root[data-theme="wb"] {   /* white text on black */
    --bg: #000000; --surface: #000000; --text: #ffffff; --muted: #cccccc;
    --accent: #ffffff; --border: #888888; --error: #ff6b6b; color-scheme: dark;
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body { touch-action: manipulation; -webkit-tap-highlight-color: transparent; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 17px/1.6 var(--ff, Georgia, "Times New Roman", serif); }
  .pw { border-radius: 3px; cursor: pointer; }
  #present .mk.mu { text-decoration: underline; text-decoration-thickness: .07em; text-underline-offset: .14em; }
  #present .mk.mh { background: #ffe066; color: #1a1a1a; border-radius: .12em; -webkit-box-decoration-break: clone; box-decoration-break: clone; }
  #present .mk.mi { color: transparent; background: var(--accent); border-radius: .12em; cursor: pointer; -webkit-box-decoration-break: clone; box-decoration-break: clone; }
  #present .mk.mi:hover { opacity: .85; }
  .pw.on { background: color-mix(in srgb, var(--accent) 35%, transparent); outline: 2px solid var(--accent); }
  #pron { position: fixed; z-index: 150; background: var(--surface); color: var(--text); border: 1px solid var(--accent); border-radius: 8px;
          padding: 6px 12px; box-shadow: 0 6px 20px rgba(0,0,0,.3); text-align: center; font-size: 16px; line-height: 1.35; pointer-events: none; max-width: 80vw; }
  #pron .pr1 { font-weight: 700; font-size: 1.15em; }
  #pron .pr2 { color: var(--muted); font-style: italic; font-size: .9em; }
  #sbs { position: fixed; inset: 0; z-index: 120; background: var(--bg); color: var(--text); overflow: auto; padding: 3vmin 4vmin 5vmin; text-align: left; }
  #sbs .sbshead { position: sticky; top: -3vmin; z-index: 1; display: flex; align-items: center; gap: 12px; background: var(--bg); padding: 1vmin 0 12px; margin-bottom: 6px; border-bottom: 1px solid var(--border); }
  #sbs .sbstitle { flex: 1; min-width: 0; font-weight: 700; color: var(--accent); font-size: clamp(18px, 3vmin, 32px); }
  #sbs .sbshint { color: var(--muted); font-size: .85rem; white-space: nowrap; }
  #sbs .sbsgrid { display: block; margin-top: 4px; }
  #sbs .sbscard { display: grid; grid-template-columns: minmax(130px, 22%) 1fr; gap: 4px 24px; align-items: baseline; padding: 14px 10px; border-bottom: 1px solid var(--border); border-left: 4px solid transparent; }
  #sbs .sbscard:last-child { border-bottom: 0; }
  #sbs .sbscard.cur { border-left-color: var(--accent); background: color-mix(in srgb, var(--accent) 10%, transparent); }
  #sbs .sbslabel { min-width: 0; }
  #sbs .sbsname { color: var(--accent); font-weight: 700; font-size: .95rem; }
  #sbs .sbsref { color: var(--muted); font-size: .85rem; margin-top: 2px; }
  @media (max-width: 560px) { #sbs .sbscard { grid-template-columns: 1fr; } }
  #sbs .sbstext { line-height: 1.5; font-size: var(--sbs-fs, clamp(17px, 2.4vmin, 30px)); }
  #sbs .sbssize { display: flex; gap: 6px; }
  #sbs .sbssize button { min-width: 40px; }
  #sbs .sbsnote { color: var(--muted); font-size: .9rem; margin-top: 12px; }
  #present {
    position: fixed; inset: 0; z-index: 100; background: var(--bg); color: var(--text);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    padding: 4vmin 5vmin; text-align: center;
  }
  #present .pref { color: var(--accent); font-weight: 700; font-size: clamp(20px, 4vmin, 44px); margin-bottom: 2vmin; flex: none; }
  #present .ptext { flex: 1; min-height: 0; width: 100%; display: flex; align-items: center; justify-content: center; overflow: hidden; }
  #present #pinner { width: 100%; line-height: 1.35; }
  #present #pinner .pslh { font-size: .55em; font-weight: 700; color: var(--accent); margin: .7em 0 .1em; line-height: 1.2; }
  #present #pinner .pslh:first-child { margin-top: 0; }
  #present #pinner .pslp { margin: 0; }
  #present #pinner .pv { font-size: .6em; line-height: 0; vertical-align: super; font-weight: 700; color: var(--accent); }
  #present .pcount { position: absolute; top: 1.5vmin; right: 3vmin; color: var(--muted); font-size: 14px; }
  [hidden] { display: none !important; }
  html, body { height: 100%; overflow: hidden; }
  body { font-size: 17px; line-height: 1.6; user-select: none; -webkit-user-select: none; }
  body.hidecur, body.hidecur * { cursor: none !important; }
  #present { position: fixed; inset: 0; height: 100vh; height: 100dvh; padding: 4vmin 5vmin; z-index: 1; }
  #present .applogo { display: none; }
  #present .applogo.has { display: block; right: 14px; bottom: 14px; }
  #pron { font-size: clamp(16px, 2.2vmin, 40px); max-width: 80%; }
  #cover { position: fixed; inset: 0; background: #000; z-index: 300; }
  #idle { position: fixed; inset: 0; z-index: 2; display: flex; flex-direction: column; align-items: center; justify-content: center;
          gap: 1.2vmin; text-align: center; color: var(--muted); background: var(--bg); padding: 4vmin; }
  #idle .idlelogo { max-width: 40vw; max-height: 40vh; object-fit: contain; display: none; }
  #idle .idlelogo.has { display: block; }
  #idle .idlehint { font-size: clamp(14px, 2vmin, 26px); }
  #idle .idlehint.sub { font-size: clamp(12px, 1.6vmin, 20px); opacity: .8; }
  body.preview #idle .idlehint.sub, body.fs #idle .idlehint.sub { display: none; }
</style>
</head>
<body>
<div id="present">
  <img class="applogo" id="presLogo" alt="">
  <div class="pref" id="pref"></div>
  <div class="ptext" id="ptext"><div id="pinner"></div></div>
  <div id="pron" hidden><div class="pr1" id="pr1"></div><div class="pr2" id="pr2"></div></div>
</div>
<div id="idle">
  <img class="idlelogo" id="idleLogo" alt="">
  <div class="idlehint" id="idleMsg">Waiting for the controller&hellip;</div>
  <div class="idlehint sub" id="idleSub">Click this window or press F for full screen</div>
</div>
<div id="cover" hidden></div>
<script>
(function () {
  var $ = function (id) { return document.getElementById(id); };
  var qs = new URLSearchParams(location.search), preview = qs.has("preview");
  var isReceiver = !!(window.navigator.presentation && navigator.presentation.receiver);
  var myId = Math.random().toString(36).slice(2, 8);
  var conns = [], bc = null, scale = null, started = false;
  var ORIGIN = location.origin === "null" ? "*" : location.origin;
  document.body.classList.toggle("preview", preview);
  try { if (!preview && window.BroadcastChannel) bc = new BroadcastChannel("verselookup-display"); } catch (e) { bc = null; }

  // ---- talking to the controller ----
  function send(m) {
    var s = JSON.stringify(m);
    if (preview) { try { parent.postMessage(s, ORIGIN); } catch (e) {} return; }
    conns.forEach(function (c) { try { if (c.state === "connected") c.send(s); } catch (e) {} });
    if (bc) { try { bc.postMessage(s); } catch (e) {} }
  }
  function hello() {
    send({ t: "hello", id: myId, w: window.innerWidth, h: window.innerHeight, preview: preview, receiver: isReceiver, fs: !!document.fullscreenElement });
  }
  function addConn(c) {
    if (conns.indexOf(c) < 0) conns.push(c);
    c.addEventListener("message", function (e) { onMsg(e.data); });
    var drop = function () { var i = conns.indexOf(c); if (i >= 0) conns.splice(i, 1); };
    c.addEventListener("close", drop); c.addEventListener("terminate", drop);
    setTimeout(hello, 50);
  }
  if (isReceiver) {
    navigator.presentation.receiver.connectionList.then(function (list) {
      list.connections.forEach(addConn);
      list.addEventListener("connectionavailable", function (e) { addConn(e.connection); });
    }).catch(function () {});
  }
  if (bc) bc.onmessage = function (e) { onMsg(e.data); };
  if (preview) window.addEventListener("message", function (e) { if (e.source === parent) onMsg(e.data); });
  function onMsg(raw) {
    var m; try { m = typeof raw === "string" ? JSON.parse(raw) : raw; } catch (e) { return; }
    if (!m || typeof m !== "object") return;
    if (m.t === "who") hello();
    else if (m.t === "state") apply(m);
    else if (m.t === "scroll") { var el = $("sbs"); if (el) el.scrollTop += m.d * el.clientHeight; }
  }

  // ---- drawing ----
  function fit() {
    var box = $("ptext"), el = $("pinner");
    var lo = 12, hi = Math.max(48, Math.min(window.innerHeight, 900));
    while (lo < hi) {
      var mid = Math.ceil((lo + hi) / 2);
      el.style.fontSize = mid + "px";
      if (el.offsetHeight <= box.clientHeight && el.scrollWidth <= box.clientWidth) lo = mid; else hi = mid - 1;
    }
    el.style.fontSize = (scale === null || scale >= 1 ? lo : Math.max(12, Math.round(lo * scale))) + "px";
    placePron();
  }
  var pronData = null;
  function placePron() {
    var el = $("pron");
    var w = pronData && document.querySelector("#pinner .pw.on");
    if (!w) { el.hidden = true; return; }
    $("pr1").textContent = pronData.l1 || ""; $("pr2").textContent = pronData.l2 || "";
    el.hidden = false;
    var r = w.getBoundingClientRect(), eh = el.offsetHeight, ew = el.offsetWidth, vw = window.innerWidth, vh = window.innerHeight, gap = 8;
    var above = r.top, below = vh - r.bottom;
    var useAbove = above >= eh + gap || (!(below >= eh + gap) && above >= below);
    el.style.top = (useAbove ? Math.max(4, r.top - eh - gap) : Math.min(vh - eh - 4, r.bottom + gap)) + "px";
    el.style.left = Math.max(4, Math.min(vw - ew - 4, r.left + r.width / 2 - ew / 2)) + "px";
  }
  var sbsTitleSeen = null;
  function drawSbs(d) {
    var el = $("sbs");
    if (!d) { if (el) el.remove(); sbsTitleSeen = null; return; }
    var keep = 0;
    if (!el) { el = document.createElement("div"); el.id = "sbs"; $("present").appendChild(el); }
    else if (sbsTitleSeen === d.title) keep = el.scrollTop;
    sbsTitleSeen = d.title;
    el.textContent = "";
    var head = document.createElement("div"); head.className = "sbshead";
    var title = document.createElement("div"); title.className = "sbstitle"; title.textContent = d.title;
    head.appendChild(title);
    var grid = document.createElement("div"); grid.className = "sbsgrid";
    d.cards.forEach(function (c) {
      var card = document.createElement("div"); card.className = "sbscard" + (c.cur ? " cur" : "");
      var lab = document.createElement("div"); lab.className = "sbslabel";
      var n = document.createElement("div"); n.className = "sbsname"; n.textContent = c.name;
      var r = document.createElement("div"); r.className = "sbsref"; r.textContent = c.ref;
      lab.appendChild(n); lab.appendChild(r);
      var t = document.createElement("div"); t.className = "sbstext"; t.textContent = c.text;
      card.appendChild(lab); card.appendChild(t); grid.appendChild(card);
    });
    el.appendChild(head); el.appendChild(grid);
    var base = Math.max(17, Math.min(30, 0.024 * Math.min(window.innerWidth, window.innerHeight)));
    if (d.k && Math.abs(d.k - 1) > 0.001) el.style.setProperty("--sbs-fs", Math.max(10, Math.min(160, base * d.k)).toFixed(1) + "px");
    else el.style.removeProperty("--sbs-fs");
    el.scrollTop = keep;
  }
  function setLogo(src) {
    ["presLogo", "idleLogo"].forEach(function (id) {
      var im = $(id);
      if (src) { im.src = src; im.classList.add("has"); } else { im.removeAttribute("src"); im.classList.remove("has"); }
    });
  }
  function apply(s) {
    var root = document.documentElement;
    if (s.theme) root.setAttribute("data-theme", s.theme); else root.removeAttribute("data-theme");
    if (s.style) root.setAttribute("style", s.style); else root.removeAttribute("style");
    if (s.logo !== undefined) setLogo(s.logo);
    $("cover").hidden = !s.blank;
    $("idle").hidden = !s.idle;
    if (s.idle) { $("idleMsg").textContent = s.msg || "Waiting for the controller…"; drawSbs(null); return; }
    started = true;
    scale = typeof s.scale === "number" ? s.scale : null;
    pronData = s.pron || null;
    $("pref").textContent = s.ref || "";
    $("pinner").innerHTML = s.html || "";
    drawSbs(s.sbs);
    fit();
  }

  // taps on the screen itself (e.g. a touch display, or the small preview on the phone) are passed back
  $("pinner").addEventListener("click", function (e) {
    var t = e.target.closest ? e.target.closest(".mk.mi") : null;
    if (t && t.dataset.s !== undefined) { send({ t: "cmd", c: "reveal", s: +t.dataset.s, e: +t.dataset.e }); return; }
    var pw = e.target.closest ? e.target.closest(".pw") : null;
    if (pw) send({ t: "cmd", c: "word", i: Array.prototype.indexOf.call(document.querySelectorAll("#pinner .pw"), pw) });
  });

  // ---- full screen, resizing, cursor ----
  function toggleFs() {
    var d = document, r = d.documentElement;
    if (d.fullscreenElement) { if (d.exitFullscreen) d.exitFullscreen().catch(function () {}); }
    else if (r.requestFullscreen) r.requestFullscreen().catch(function () {});
  }
  if (!preview) {
    document.addEventListener("click", function (e) {
      if (e.target.closest && (e.target.closest(".mk.mi") || e.target.closest(".pw"))) return;
      toggleFs();
    });
    document.addEventListener("keydown", function (e) {
      if (e.ctrlKey || e.metaKey || e.altKey) return;
      if (e.key === "f" || e.key === "F") toggleFs();
    });
    var curT = 0;
    document.addEventListener("mousemove", function () {
      document.body.classList.remove("hidecur"); clearTimeout(curT);
      curT = setTimeout(function () { document.body.classList.add("hidecur"); }, 2500);
    });
    document.addEventListener("fullscreenchange", function () { document.body.classList.toggle("fs", !!document.fullscreenElement); hello(); });
    window.addEventListener("beforeunload", function () { send({ t: "bye", id: myId }); });
    setInterval(function () { send({ t: "alive", id: myId }); }, 4000);
  }
  var rt = 0;
  window.addEventListener("resize", function () {
    if (started) fit();
    clearTimeout(rt); rt = setTimeout(hello, 150);
  });
  hello();
})();
</script>
</body>
</html>
