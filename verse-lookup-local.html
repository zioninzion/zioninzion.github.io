<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Verse Lookup</title>
<style>
  :root {
    --bg: #faf8f4; --surface: #ffffff; --text: #231f1a; --muted: #6f675d;
    --accent: #7a4b1e; --border: #e3ddd2; --error: #b3261e;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #1b1814; --surface: #25211c; --text: #efe9df; --muted: #a39a8c;
      --accent: #d9a566; --border: #3a342c; --error: #ff8a80;
      color-scheme: dark;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 17px/1.6 Georgia, "Times New Roman", serif; }
  main { max-width: 720px; margin: 0 auto; padding: 28px 18px 60px; }
  form { display: flex; gap: 8px; }
  input[type=text] {
    flex: 1; min-width: 0; padding: 12px 14px; font: inherit; color: var(--text);
    background: var(--surface); border: 1px solid var(--border); border-radius: 8px;
  }
  button {
    font: inherit; padding: 10px 18px; border: 0; border-radius: 8px;
    background: var(--accent); color: var(--bg); cursor: pointer; font-weight: 600;
  }
  button.link { background: none; color: var(--accent); padding: 0; font-weight: 400; text-decoration: underline; font-size: .85rem; }
  #load {
    border: 2px dashed var(--border); border-radius: 10px; padding: 26px 18px;
    text-align: center; color: var(--muted); margin-top: 18px;
  }
  #load.drag { border-color: var(--accent); }
  #info { color: var(--muted); font-size: .85rem; margin: 8px 2px 0; }
  #status { margin: 18px 0 6px; font-size: .9rem; color: var(--muted); }
  #status.error { color: var(--error); }
  .verse { background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 10px 16px; margin: 10px 0; }
  .ref { font-weight: 700; color: var(--accent); font-size: .95rem; }
  .text { margin: 2px 0 0; }
  .verse:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
  .verse.sel { border-color: var(--accent); background: color-mix(in srgb, var(--accent) 14%, var(--surface)); }
  .verse { cursor: pointer; user-select: none; }
  .verse.copied .ref::after { content: " \00b7  Copied"; color: var(--muted); font-weight: 400; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<main>
  <form id="form">
    <input type="text" id="q" placeholder="e.g. Gen. 1:1; Eph. 4:4-6; Rev. 21:2, 9-10" autocomplete="off" autofocus>
    <button type="submit">Look up</button>
  </form>
  <div id="info" hidden></div>

  <div id="load">
    Choose or drop your text file to begin<br><br>
    <input type="file" id="file" accept=".txt,text/plain">
  </div>

  <div id="status"></div>
  <div id="results"></div>
</main>

<!--EMBED-->
<script>
(function () {
  var $ = function (id) { return document.getElementById(id); };
  var SRC = "<!DOCTYPE html>\n" + document.documentElement.outerHTML;  // pristine copy, for export
  var loadedText = "", loadedName = "";

  var BOOKS = [
    ["Genesis","Gen."],["Exodus","Exo."],["Leviticus","Lev."],["Numbers","Num."],["Deuteronomy","Deut."],
    ["Joshua","Josh."],["Judges","Judg."],["Ruth","Ruth"],["1 Samuel","1 Sam."],["2 Samuel","2 Sam."],
    ["1 Kings","1 Kings"],["2 Kings","2 Kings"],["1 Chronicles","1 Chron."],["2 Chronicles","2 Chron."],
    ["Ezra","Ezra"],["Nehemiah","Neh."],["Esther","Esth."],["Job","Job"],["Psalms","Psa."],["Proverbs","Prov."],
    ["Ecclesiastes","Eccl."],["Song of Solomon","S.S."],["Isaiah","Isa."],["Jeremiah","Jer."],["Lamentations","Lam."],
    ["Ezekiel","Ezek."],["Daniel","Dan."],["Hosea","Hosea"],["Joel","Joel"],["Amos","Amos"],["Obadiah","Oba."],
    ["Jonah","Jonah"],["Micah","Micah"],["Nahum","Nahum"],["Habakkuk","Hab."],["Zephaniah","Zeph."],["Haggai","Hag."],
    ["Zechariah","Zech."],["Malachi","Mal."],["Matthew","Matt."],["Mark","Mark"],["Luke","Luke"],["John","John"],
    ["Acts","Acts"],["Romans","Rom."],["1 Corinthians","1 Cor."],["2 Corinthians","2 Cor."],["Galatians","Gal."],
    ["Ephesians","Eph."],["Philippians","Phil."],["Colossians","Col."],["1 Thessalonians","1 Thes."],
    ["2 Thessalonians","2 Thes."],["1 Timothy","1 Tim."],["2 Timothy","2 Tim."],["Titus","Titus"],["Philemon","Philem."],
    ["Hebrews","Heb."],["James","James"],["1 Peter","1 Pet."],["2 Peter","2 Pet."],["1 John","1 John"],
    ["2 John","2 John"],["3 John","3 John"],["Jude","Jude"],["Revelation","Rev."]
  ];
  var SINGLE = { "Obadiah":1, "Philemon":1, "2 John":1, "3 John":1, "Jude":1 };

  // Extra accepted abbreviations (checked before partial matching)
  var ALIASES = { jdg: "Judges", jud: "Jude", phm: "Philemon", philm: "Philemon" };

  function key(s) { return s.toLowerCase().replace(/[^a-z0-9]/g, ""); }
  var fullKeys = BOOKS.map(function (b) { return key(b[0]); });
  var abbrKeys = BOOKS.map(function (b) { return key(b[1]); });

  function resolveBook(s) {
    var k = key(s), i, c = [];
    if (!k) return null;
    for (i = 0; i < BOOKS.length; i++) if (fullKeys[i] === k || abbrKeys[i] === k) return i;
    if (ALIASES.hasOwnProperty(k)) return fullKeys.indexOf(key(ALIASES[k]));
    for (i = 0; i < BOOKS.length; i++) if (fullKeys[i].indexOf(k) === 0 || abbrKeys[i].indexOf(k) === 0) c.push(i);
    return c.length === 1 ? c[0] : null;
  }

  // ---- data ----
  var data = {}, labels = {}, noChap = {}, count = 0;

  function parseText(text) {
    data = {}; labels = {}; noChap = {}; count = 0;
    var re = /^(.+?)\s+(?:(\d+):)?(\d+)\s+(\S.*)$/, last = null;
    text.split(/\r?\n/).forEach(function (line) {
      var t = line.trim();
      if (!t) return;
      var m = re.exec(t);
      if (m) {
        var bi = resolveBook(m[1]);
        if (bi !== null) {
          var ch = m[2] ? +m[2] : 1, v = +m[3];
          data[bi] = data[bi] || {};
          data[bi][ch] = data[bi][ch] || {};
          last = { bi: bi, ch: ch, v: v, text: m[4] };
          data[bi][ch][v] = last;
          if (!labels[bi]) { labels[bi] = m[1]; noChap[bi] = !m[2]; }
          count++;
          return;
        }
      }
      if (last) last.text += " " + t;
    });
    return count;
  }

  function refOf(e) {
    var l = labels[e.bi] || BOOKS[e.bi][1];
    return noChap[e.bi] ? l + " " + e.v : l + " " + e.ch + ":" + e.v;
  }

  // ---- query ----
  function runQuery(q) {
    var out = [], notes = [], curBook = null;

    var DASH = "[-\\u2013\\u2014]";   // hyphen, en dash, em dash

    function bad(t) { notes.push('Can\u2019t read "' + t + '"'); }

    // v1 null = from first verse of c1; v2 null = through end of c2
    function span(bi, c1, v1, c2, v2) {
      for (var cc = c1; cc <= c2; cc++) {
        var chap = data[bi] && data[bi][cc];
        if (!chap) { notes.push(BOOKS[bi][0] + " " + cc + " is not in your text"); continue; }
        Object.keys(chap).map(Number).sort(function (p, q) { return p - q; }).forEach(function (vv) {
          if (cc === c1 && v1 !== null && vv < v1) return;
          if (cc === c2 && v2 !== null && vv > v2) return;
          out.push(chap[vv]);
        });
      }
    }

    function addVerses(bi, ch, list) {
      var single = !!SINGLE[BOOKS[bi][0]];
      list.split(",").forEach(function (part) {
        var t = part.trim();
        // 1:4-2:3  -> ch 1 v4 through ch 2 v3
        var x = new RegExp("^(\\d+)\\s*" + DASH + "\\s*(\\d+)\\s*:\\s*(\\d+)$").exec(t);
        if (x) {
          var ec = +x[2];
          if (single || ec <= ch || ec - ch > 150) { bad(t); return; }
          span(bi, ch, +x[1], ec, +x[3]);
          return;
        }
        var r = new RegExp("^(\\d+)(?:\\s*(" + DASH + ")\\s*(\\d+))?$").exec(t);
        if (!r) { bad(t); return; }
        var a = +r[1], b = r[3] === undefined ? a : +r[3], em = r[2] === "\u2014";
        // 1:5-2 (end < start) or 1:5\u20147 (em dash): second number is a chapter
        if (!single && r[3] !== undefined && b > ch && (em || b < a)) {
          if (b - ch > 150) { bad(t); return; }
          span(bi, ch, a, b, null);
          return;
        }
        // otherwise plain verse range, e.g. 1:5-7 -> 1:5 to 1:7
        if (b < a) { bad(t); return; }
        if (b - a > 300) b = a + 300;
        for (var v = a; v <= b; v++) {
          var e = data[bi] && data[bi][ch] && data[bi][ch][v];
          if (e) out.push(e);
          else notes.push(BOOKS[bi][0] + " " + (single ? "" : ch + ":") + v + " is not in your text");
        }
      });
    }

    q.split(";").forEach(function (seg) {
      var s = seg.trim();
      if (!s) return;
      var rest = s, m = /^((?:[1-3]\s*)?[A-Za-z][A-Za-z.\s]*?)\s*(\d.*)?$/.exec(s);
      if (m) {
        var bi = resolveBook(m[1]);
        if (bi === null) { notes.push('Unknown book "' + m[1].trim() + '"'); curBook = null; return; }
        curBook = bi;
        rest = m[2] || "";
        if (!rest) { notes.push("Add a chapter for " + BOOKS[bi][0]); return; }
      } else if (curBook === null) {
        notes.push('Can\u2019t read "' + s + '"'); return;
      }
      rest = rest.replace(/(\d)[a-z]\b/g, "$1");
      var c = /^(\d+)\s*:\s*(.+)$/.exec(rest);
      if (c) { addVerses(curBook, +c[1], c[2]); return; }
      if (SINGLE[BOOKS[curBook][0]]) { addVerses(curBook, 1, rest); return; }
      var rt = rest.trim();
      // Gen 1-2:3 -> ch 1 from the start through 2:3
      var w1 = new RegExp("^(\\d+)\\s*" + DASH + "\\s*(\\d+)\\s*:\\s*(\\d+)$").exec(rt);
      if (w1) {
        if (+w1[2] <= +w1[1] || +w1[2] - +w1[1] > 150) { bad(s); return; }
        span(curBook, +w1[1], null, +w1[2], +w1[3]);
        return;
      }
      // Gen 1 / Gen 1-3 -> whole chapters
      var w2 = new RegExp("^(\\d+)(?:\\s*" + DASH + "\\s*(\\d+))?$").exec(rt);
      if (!w2) { bad(s); return; }
      var ca = +w2[1], cb = w2[2] ? +w2[2] : ca;
      if (cb < ca || cb - ca > 150) { bad(s); return; }
      span(curBook, ca, null, cb, null);
    });
    return { out: out, notes: notes };
  }

  function show(q, live) {
    var r = runQuery(q), box = $("results");
    if (live) {
      // while typing, ignore half-typed input: keep what's on screen
      var isMissing = function (n) { return n.indexOf("is not in your text") > -1; };
      if (!r.out.length && !r.notes.every(isMissing)) { $("status").textContent = ""; $("status").className = ""; return; }
      r.notes = r.notes.filter(isMissing);
    }
    box.innerHTML = "";
    r.out.forEach(function (e, i) {
      var d = document.createElement("div"); d.className = "verse";
      d.tabIndex = i === 0 ? 0 : -1;
      d.dataset.copy = refOf(e) + " " + e.text;
      var a = document.createElement("div"); a.className = "ref"; a.textContent = refOf(e);
      var p = document.createElement("p"); p.className = "text"; p.textContent = e.text;
      d.appendChild(a); d.appendChild(p); box.appendChild(d);
    });
    var st = $("status");
    st.textContent = r.notes.join(" \u00b7 ") || (r.out.length ? "" : "Nothing found.");
    st.className = r.out.length && !r.notes.length ? "" : (r.out.length ? "" : "error");
  }

  // ---- storage of the loaded file (this browser only) ----
  function db() {
    return new Promise(function (res, rej) {
      var r = indexedDB.open("verselookup", 1);
      r.onupgradeneeded = function () { r.result.createObjectStore("kv"); };
      r.onsuccess = function () { res(r.result); };
      r.onerror = function () { rej(r.error); };
    });
  }
  function kv(mode, fn) {
    return db().then(function (d) {
      return new Promise(function (res, rej) {
        var req = fn(d.transaction("kv", mode).objectStore("kv"));
        req.onsuccess = function () { res(req.result); };
        req.onerror = function () { rej(req.error); };
      });
    });
  }

  function loaded(name, embedded) {
    $("load").hidden = true;
    if (embedded) return;
    var info = $("info");
    info.hidden = false;
    info.innerHTML = "";
    info.appendChild(document.createTextNode(name + " \u2014 " + count.toLocaleString() + " verses \u00b7 "));
    var b = document.createElement("button");
    b.type = "button"; b.className = "link"; b.textContent = "Remove file";
    b.onclick = function () {
      kv("readwrite", function (s) { return s.delete("bible"); }).catch(function () {});
      data = {}; count = 0;
      info.hidden = true; $("load").hidden = false; $("results").innerHTML = ""; $("status").textContent = "";
    };
    info.appendChild(b);
    info.appendChild(document.createTextNode(" \u00b7 "));
    var x = document.createElement("button");
    x.type = "button"; x.className = "link"; x.textContent = "Save a copy with the text built in";
    x.onclick = exportCopy;
    info.appendChild(x);
  }

  function exportCopy() {
    var tag = "<" + 'script type="application/json" id="embedded">' +
      JSON.stringify({ name: loadedName, text: loadedText }).replace(/</g, "\\u003c") +
      "</" + "script>";
    var html = SRC.replace("<!--" + "EMBED-->", function () { return tag; });
    var a = document.createElement("a");
    a.href = URL.createObjectURL(new Blob([html], { type: "text/html" }));
    a.download = "verse-lookup-embedded.html";
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    setTimeout(function () { URL.revokeObjectURL(a.href); }, 2000);
  }

  function ingest(text, name, save, embedded) {
    var n = parseText(text);
    loadedText = text; loadedName = name;
    if (!n) { $("status").textContent = "No verses recognized. Lines should look like: Gen. 1:1 In the beginning..."; $("status").className = "error"; return; }
    if (save) kv("readwrite", function (s) { return s.put({ name: name, text: text }, "bible"); }).catch(function () {});
    $("status").textContent = ""; $("status").className = "";
    loaded(name, embedded);
  }

  function readFile(f) {
    if (!f) return;
    var r = new FileReader();
    r.onload = function () { ingest(String(r.result), f.name, true); };
    r.readAsText(f);
  }

  $("file").onchange = function () { readFile(this.files[0]); };
  var z = $("load");
  ["dragenter", "dragover"].forEach(function (ev) {
    z.addEventListener(ev, function (e) { e.preventDefault(); z.classList.add("drag"); });
  });
  ["dragleave", "drop"].forEach(function (ev) {
    z.addEventListener(ev, function (e) { e.preventDefault(); z.classList.remove("drag"); });
  });
  z.addEventListener("drop", function (e) { readFile(e.dataTransfer.files[0]); });

  $("form").onsubmit = function (e) {
    e.preventDefault();
    var q = $("q").value.trim();
    if (!q) return;
    clearTimeout(liveTimer); liveTimer = null;
    if (!count) { $("status").textContent = "Load your text file first."; $("status").className = "error"; return; }
    show(q);
  };

  // ---- keyboard: Tab from the box into the verses, Up/Down to move, Enter to copy ----
  function copyText(t) {
    function fallback() {
      var ta = document.createElement("textarea");
      ta.value = t; ta.style.position = "fixed"; ta.style.opacity = "0";
      document.body.appendChild(ta); ta.select();
      try { document.execCommand("copy"); } catch (e) {}
      document.body.removeChild(ta);
    }
    if (navigator.clipboard && navigator.clipboard.writeText) {
      return navigator.clipboard.writeText(t).catch(fallback);
    }
    fallback();
    return Promise.resolve();
  }

  var anchor = 0;

  function verses() { return Array.prototype.slice.call($("results").querySelectorAll(".verse")); }

  function moveFocus(el) {
    verses().forEach(function (v) { v.tabIndex = -1; });
    el.tabIndex = 0; el.focus(); el.scrollIntoView({ block: "nearest" });
  }
  function clearSel() { verses().forEach(function (v) { v.classList.remove("sel"); }); }

  // plain move: single verse, selection cleared
  function focusVerse(el) {
    if (!el) return;
    clearSel(); anchor = verses().indexOf(el); moveFocus(el);
  }
  // Shift move: select from anchor through verse i
  function extendTo(i) {
    var all = verses();
    if (i < 0 || i >= all.length) return;
    clearSel();
    for (var k = Math.min(anchor, i); k <= Math.max(anchor, i); k++) all[k].classList.add("sel");
    moveFocus(all[i]);
  }
  function copySelected(current) {
    var sel = verses().filter(function (v) { return v.classList.contains("sel"); });
    if (!sel.length) sel = [current];
    return copyText(sel.map(function (v) { return v.dataset.copy; }).join("\n")).then(function () {
      current.focus();
      sel.forEach(function (v) { v.classList.add("copied"); });
      setTimeout(function () { sel.forEach(function (v) { v.classList.remove("copied"); }); }, 1200);
    });
  }

  // "/" jumps to the text box from anywhere on the page
  document.addEventListener("keydown", function (e) {
    if (e.key !== "/" || e.ctrlKey || e.metaKey || e.altKey) return;
    var t = e.target, tag = t && t.tagName;
    if (tag === "INPUT" || tag === "TEXTAREA") return;
    e.preventDefault();
    var q = $("q");
    q.focus();
    q.setSelectionRange(q.value.length, q.value.length);
  });

  // ---- instant lookup as you type ----
  var liveTimer = null;
  function liveRun() {
    liveTimer = null;
    var q = $("q").value.trim();
    if (!q) { $("results").innerHTML = ""; $("status").textContent = ""; $("status").className = ""; return; }
    if (!count) return;
    show(q, true);
  }
  function flushLive() { if (liveTimer) { clearTimeout(liveTimer); liveRun(); } }
  $("q").addEventListener("input", function () {
    clearTimeout(liveTimer);
    liveTimer = setTimeout(liveRun, 100);
  });

  $("q").addEventListener("keydown", function (e) {
    if (e.key === "Tab" && !e.shiftKey) {
      flushLive();
      if (verses().length) { e.preventDefault(); focusVerse(verses()[0]); }
    }
  });

  $("results").addEventListener("keydown", function (e) {
    var v = e.target.closest ? e.target.closest(".verse") : null;
    if (!v) return;
    var all = verses(), i = all.indexOf(v), mod = e.ctrlKey || e.metaKey;

    if (e.key === "ArrowDown" || e.key === "ArrowUp") {
      e.preventDefault();
      var n = i + (e.key === "ArrowDown" ? 1 : -1);
      if (e.shiftKey) extendTo(n); else focusVerse(all[n]);
    } else if (e.key === "Home" || e.key === "End" || e.key === "ArrowLeft" || e.key === "ArrowRight") {
      e.preventDefault();
      var t = (e.key === "Home" || e.key === "ArrowLeft") ? 0 : all.length - 1;
      if (e.shiftKey) extendTo(t); else focusVerse(all[t]);
    } else if (mod && e.key.toLowerCase() === "a") {
      e.preventDefault();
      all.forEach(function (x) { x.classList.add("sel"); });
    } else if (e.key === "Tab" && !e.shiftKey) {
      if (v.nextElementSibling) { e.preventDefault(); focusVerse(v.nextElementSibling); }
    } else if (e.key === "Tab" && e.shiftKey) {
      e.preventDefault();
      if (v.previousElementSibling) focusVerse(v.previousElementSibling); else $("q").focus();
    } else if (e.key === "Escape") {
      e.preventDefault();
      if (all.some(function (x) { return x.classList.contains("sel"); })) { clearSel(); } else { $("q").focus(); }
    } else if (!e.altKey && e.key.toLowerCase() === "c" && !(mod && String(window.getSelection()))) {
      e.preventDefault();
      copySelected(v);
    }
  });

  // mouse: click selects, Shift+click extends, Ctrl/Cmd+click toggles
  $("results").addEventListener("click", function (e) {
    var v = e.target.closest ? e.target.closest(".verse") : null;
    if (!v) return;
    var all = verses(), i = all.indexOf(v);
    if (e.shiftKey) extendTo(i);
    else if (e.ctrlKey || e.metaKey) { v.classList.toggle("sel"); anchor = i; moveFocus(v); }
    else focusVerse(v);
  });

  var emb = document.getElementById("embedded"), embData = null;
  if (emb) { try { embData = JSON.parse(emb.textContent); } catch (e) {} }
  if (embData && embData.text) {
    ingest(embData.text, embData.name || "embedded", false, true);
  } else {
    kv("readonly", function (s) { return s.get("bible"); })
      .then(function (rec) { if (rec) ingest(rec.text, rec.name, false); })
      .catch(function () {});
  }
})();
</script>
</body>
</html>
