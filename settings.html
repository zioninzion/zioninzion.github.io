    <main class="body-content" id="main">
      <h1 class="title">Settings</h1>
      <div style="text-align: center">
        <div style="text-align: left">
          <p>Keyboard Navigation:</p>
          <ul>
            <li><b>h</b> - move left</li>
            <li><b>l</b> - move right</li>
            <li><b>j</b> - move down</li>
            <li><b>k</b> - move up</li>
            <li><b>s</b> - Settings</li>
          </ul>
        </div>
      </div>
    </main>
    <script>
      isKeyPressed = {
              'l': false,
              'h': false,
            }
      document.onkeydown = (keyDownEvent) => {
              if (keyDownEvent.ctrlKey || keyDownEvent.metaKey || keyDownEvent.altKey || /INPUT|TEXTAREA|SELECT/.test(keyDownEvent.target.tagName) || keyDownEvent.target.isContentEditable) return;
              Object.keys(isKeyPressed).forEach(key => isKeyPressed[key] = false);
              isKeyPressed[keyDownEvent.key] = true;
              if (isKeyPressed["l"]) {
                      window.location.href = "index.html";
                    };
              if (isKeyPressed["h"]) {
                      window.location.href = "music.html";
                    }
            };
    </script>
